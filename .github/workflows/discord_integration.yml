name: Discord Commits

on: 
  pull_request:
    branches: [ main ]

jobs:
  discord:
    runs-on: ubuntu-latest  
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Removi o "with:" vazio que estava aqui

      - name: Discord Commits
        uses: Sniddl/discord-commits@v1.8
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          template: "avatar-with-link"
          include-extras: true