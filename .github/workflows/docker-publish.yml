name: Publicar Imagem no DockerHub

# Define quando o pipeline vai rodar. Nesse caso, sempre que houver um push na branch 'main'.
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest # O ambiente onde o job vai rodar

    steps:      
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # 2. Faz login no DockerHub usando os Secrets que você configurou
      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Lê o seu Dockerfile, faz o build e envia (push) para o DockerHub
      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true          
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/testedocker:latest